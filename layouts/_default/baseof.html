<!doctype html>
{{- /*
  Dark mode only: the theme's prose variants stay active without a flash.
*/ -}}
<html
  class="not-ready dark lg:text-base"
  lang="{{- or site.LanguageCode site.Language.Lang -}}"
  dir="{{- site.Params.direction | default `ltr` -}}"
>
  {{- partial "head.html" . -}}
  <!-- data-page drives the per-page styling hooks in custom.css -->
  <body data-page="{{- if .IsHome -}}home{{- else -}}{{- path.Base .RelPermalink -}}{{- end -}}">
    <canvas class="paint-background" aria-hidden="true"></canvas>
    {{- partial "header.html" . -}}

    <main class="site-main wrap prose prose-neutral dark:prose-invert">
      {{- block "main" . -}}{{- end -}}
    </main>

    {{- partial "footer.html" . -}}

    <button class="background-reset" type="button" aria-label="Reset background" title="Reset background">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" />
      </svg>
    </button>
  </body>
</html>
