{{- /*
  Note: the theme ships a pre-compiled Tailwind bundle, so only utility classes
  the theme itself already uses exist. Layout here is plain CSS in custom.css.
*/ -}}
<header class="wrap">
  <div class="site-header-row">
    <a class="wordmark" href="{{- `` | absURL -}}">{{- site.Title -}}</a>

    {{- with site.Menus.main -}}
    <nav class="site-nav">
      {{- range . -}}
      <a
        class="nav-link"
        href="{{- .URL -}}"
        {{- if eq $.RelPermalink .URL }} aria-current="page"{{ end -}}
      >{{- .Name -}}</a>
      {{- end -}}
    </nav>
    {{- end -}}
  </div>
</header>
